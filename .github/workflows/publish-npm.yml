name: publish npm

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish plexus-agent-config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Sync versions from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version extracted from tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          echo "Syncing all packages to version $VERSION"

          node scripts/bump.mjs "$VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm run release:npm
