name: publish npm

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish plexus-agent-config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Sync package versions from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version extracted from tag: $VERSION" >&2
            exit 1
          fi

          echo "Syncing all packages to version $VERSION (from $TAG)"

          node -e "
            const fs = require('fs');
            const pkg = process.env.TARGET_VERSION;
            const files = [
              'package.json',
              'apps/web/package.json',
              'packages/core/package.json',
              'packages/cli/package.json'
            ];
            for (const f of files) {
              let txt = fs.readFileSync(f, 'utf8');
              txt = txt.replace(/\"version\":\\s*\"\\d+\\.\\d+\\.\\d+\"/, '\"version\": \"' + pkg + '\"');
              fs.writeFileSync(f, txt);
              console.log('  updated', f);
            }
          "

          npm install --package-lock-only 2>/dev/null || true
        env:
          TARGET_VERSION: ${{ env.VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm run release:npm
